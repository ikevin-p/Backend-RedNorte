spring.application.name=ms-chatbot
server.port=8097

spring.datasource.url=jdbc:mysql://cnt-db-rednorte:3306/db_chatbot?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=11223344
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=http://cnt-eureka-server:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

# ── Configuracion de Ollama ──────────────────────────────────────────
# host.docker.internal: el contenedor del microservicio corre dentro de
# Docker, pero Ollama corre directamente en el host (Windows), no en
# otro contenedor. host.docker.internal es el DNS especial que Docker
# Desktop expone para que un contenedor llegue al host que lo aloja.
# Si en algun momento Ollama tambien se dockeriza, cambiar esto por el
# nombre del servicio (ej. cnt-ollama:11434).
ollama.base-url=http://host.docker.internal:11434
ollama.modelo=llama3.2:3b
ollama.timeout-segundos=60

# ── URLs internas de otros microservicios (red interna de Docker) ───
rednorte.ms-agenda-medica.url=http://cnt-ms-agenda-medica:8094
rednorte.ms-consultas.url=http://cnt-ms-consultas:8083
rednorte.ms-usuarios.url=http://cnt-ms-usuarios:8081
