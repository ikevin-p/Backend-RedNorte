server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Eureka Dashboard via Gateway
        - id: eureka-dashboard
          uri: http://cnt-eureka-server:8761
          predicates:
            - Path=/eureka-ui/**
          filters:
            - RewritePath=/eureka-ui/(?<segment>.*), /${segment}

        # Eureka recursos estáticos
        - id: eureka-static
          uri: http://cnt-eureka-server:8761
          predicates:
            - Path=/css/**, /js/**, /fonts/**, /images/**

        # ms-usuarios
        - id: ms-usuarios
          uri: http://cnt-ms-usuarios:8081
          predicates:
            - Path=/usuarios/**, /roles/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-usuarios-cb
                fallbackUri: forward:/fallback/usuarios

        # ms-consultas
        - id: ms-consultas
          uri: http://cnt-ms-consultas:8083
          predicates:
            - Path=/consultas/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-consultas-cb
                fallbackUri: forward:/fallback/consultas

        # ms-reasignacion
        - id: ms-reasignacion
          uri: http://cnt-ms-reasignacion:8081
          predicates:
            - Path=/api/reasignacion/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-reasignacion-cb
                fallbackUri: forward:/fallback/reasignacion

        # ms-ficha-medica
        - id: ms-ficha-medica
          uri: http://cnt-ms-ficha-medica:8084
          predicates:
            - Path=/ficha/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-ficha-cb
                fallbackUri: forward:/fallback/ficha

        # ms-notificaciones
        - id: ms-notificaciones
          uri: http://cnt-ms-notificaciones:8092
          predicates:
            - Path=/notificaciones/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-notificaciones-cb
                fallbackUri: forward:/fallback/notificaciones

        # ms-establecimientos
        - id: ms-establecimientos
          uri: http://cnt-ms-establecimientos:8093
          predicates:
            - Path=/establecimientos/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-establecimientos-cb
                fallbackUri: forward:/fallback/establecimientos

        # ms-agenda-medica
        - id: ms-agenda-medica
          uri: http://cnt-ms-agenda-medica:8094
          predicates:
            - Path=/agenda/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-agenda-cb
                fallbackUri: forward:/fallback/agenda

        # ms-estadisticas
        - id: ms-estadisticas
          uri: http://cnt-ms-estadisticas:8095
          predicates:
            - Path=/estadisticas/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-estadisticas-cb
                fallbackUri: forward:/fallback/estadisticas

        # ms-auditoria
        - id: ms-auditoria
          uri: http://cnt-ms-auditoria:8096
          predicates:
            - Path=/auditoria/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-auditoria-cb
                fallbackUri: forward:/fallback/auditoria

eureka:
  client:
    service-url:
      defaultZone: http://cnt-eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      ms-usuarios-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-consultas-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-reasignacion-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-ficha-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-notificaciones-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-establecimientos-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-agenda-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-estadisticas-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-auditoria-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
