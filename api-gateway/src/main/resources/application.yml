server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # CORS global del gateway (responde el preflight OPTIONS del navegador)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # Evita que se dupliquen los headers CORS (gateway + microservicio)
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        # Eureka Dashboard via Gateway
        - id: eureka-dashboard
          uri: http://cnt-eureka-server:8761
          predicates:
            - Path=/eureka-ui/**
          filters:
            - RewritePath=/eureka-ui/(?<segment>.*), /${segment}

        # Eureka recursos estáticos
        - id: eureka-static
          uri: http://cnt-eureka-server:8761
          predicates:
            - Path=/css/**, /js/**, /fonts/**, /images/**

        # ms-usuarios
        - id: ms-usuarios
          uri: http://cnt-ms-usuarios:8081
          predicates:
            - Path=/usuarios/**, /roles/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-usuarios-cb
                fallbackUri: forward:/fallback/usuarios

        # ms-consultas (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-consultas
          uri: lb://ms-consultas
          predicates:
            - Path=/consultas/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-consultas-cb
                fallbackUri: forward:/fallback/consultas

        # ms-reasignacion (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-reasignacion
          uri: lb://ms-reasignacion
          predicates:
            - Path=/api/reasignacion/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-reasignacion-cb
                fallbackUri: forward:/fallback/reasignacion

        # ms-ficha-medica (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-ficha-medica
          uri: lb://ms-ficha-medica
          predicates:
            - Path=/ficha/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-ficha-cb
                fallbackUri: forward:/fallback/ficha

        # ms-notificaciones (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-notificaciones
          uri: lb://ms-notificaciones
          predicates:
            - Path=/notificaciones/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-notificaciones-cb
                fallbackUri: forward:/fallback/notificaciones

        # ms-establecimientos (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-establecimientos
          uri: lb://ms-establecimientos
          predicates:
            - Path=/establecimientos/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-establecimientos-cb
                fallbackUri: forward:/fallback/establecimientos

        # ms-agenda-medica (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-agenda-medica
          uri: lb://ms-agenda-medica
          predicates:
            - Path=/agenda/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-agenda-cb
                fallbackUri: forward:/fallback/agenda

        # ms-estadisticas (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-estadisticas
          uri: lb://ms-estadisticas
          predicates:
            - Path=/estadisticas/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-estadisticas-cb
                fallbackUri: forward:/fallback/estadisticas

        # ms-auditoria (registrado en Eureka — enrutado vía Service Discovery)
        - id: ms-auditoria
          uri: lb://ms-auditoria
          predicates:
            - Path=/auditoria/**
          filters:
            - name: CircuitBreaker
              args:
                name: ms-auditoria-cb
                fallbackUri: forward:/fallback/auditoria

eureka:
  client:
    service-url:
      defaultZone: http://cnt-eureka-server:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      ms-usuarios-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-consultas-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-reasignacion-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-ficha-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-notificaciones-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-establecimientos-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-agenda-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-estadisticas-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      ms-auditoria-cb:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
