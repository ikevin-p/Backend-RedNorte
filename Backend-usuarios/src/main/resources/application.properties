spring.application.name=ms-usuarios
server.port=8081

# Apunta a db_usuarios
spring.datasource.url=jdbc:mysql://cnt-db-rednorte:3306/db_usuarios?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8
spring.datasource.username=root
spring.datasource.password=11223344

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client: registra este microservicio en Service Discovery.
# Antes de esto, ms-usuarios era el unico de los 13 microservicios
# sin esta configuracion, asi que nunca aparecia en el dashboard de
# Eureka (aunque el Gateway igual podia llegar a el via la URI
# hardcodeada http://cnt-ms-usuarios:8081 configurada en el Gateway).
eureka.client.service-url.defaultZone=http://cnt-eureka-server:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

# Envio de correos (recuperacion de contraseña, confirmacion de citas).
# Las credenciales NUNCA se hardcodean aqui: vienen de variables de
# entorno definidas en docker-compose.yml, para no exponer la
# contraseña de aplicacion de Gmail en el repositorio de Git.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:rednorte.in@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000