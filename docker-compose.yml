services:
  eureka-server:
    build: ./eureka-server
    container_name: cnt-eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 5
      timeout: 5s

  api-gateway:
    build: ./api-gateway
    container_name: cnt-api-gateway
    ports:
      - "8090:8090"
    depends_on:
      eureka-server:
        condition: service_healthy

  ms-bff:
    build: ./ms-bff
    container_name: cnt-ms-bff
    ports:
      - "8091:8091"
    depends_on:
      eureka-server:
        condition: service_healthy

  ms-notificaciones:
    build: ./ms-notificaciones
    container_name: cnt-ms-notificaciones
    ports:
      - "8092:8092"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_notificaciones?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy

  ms-establecimientos:
    build: ./ms-establecimientos
    container_name: cnt-ms-establecimientos
    ports:
      - "8093:8093"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_establecimientos?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy

  ms-agenda-medica:
    build: ./ms-agenda-medica
    container_name: cnt-ms-agenda-medica
    ports:
      - "8094:8094"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_agenda?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy

  ms-auditoria:
    build: ./ms-auditoria
    container_name: cnt-ms-auditoria
    ports:
      - "8096:8096"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_auditoria?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy

  ms-estadisticas:
    build: ./ms-estadisticas
    container_name: cnt-ms-estadisticas
    ports:
      - "8095:8095"
    depends_on:
      eureka-server:
        condition: service_healthy

  ms-usuarios:
    build: ./Backend-usuarios
    container_name: cnt-ms-usuarios
    ports:
      - "8080:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_usuarios?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
      # MAIL_PASSWORD viene del archivo .env (no versionado en Git) o de
      # una variable de entorno real del sistema. Nunca se hardcodea
      # aqui: es la contraseña de aplicacion de Gmail para SMTP.
      - MAIL_USERNAME=${MAIL_USERNAME:-rednorte.in@gmail.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      db-rednorte:
        condition: service_healthy

  ms-reasignacion:
    build: ./Backend_reasignacion
    container_name: cnt-ms-reasignacion
    ports:
      - "8082:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_reasignacion?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-consultas:
    build: ./ms-consultas
    container_name: cnt-ms-consultas
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_consultas?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-ficha-medica:
    build: ./ms-ficha-medica
    container_name: cnt-ms-ficha-medica
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_ficha?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    depends_on:
      db-rednorte:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  ms-chatbot:
    build: ./ms-chatbot
    container_name: cnt-ms-chatbot
    ports:
      - "8097:8097"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://cnt-db-rednorte:3306/db_chatbot?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=11223344
    # host.docker.internal solo funciona automaticamente en Docker Desktop
    # (Windows/Mac). Se agrega extra_hosts para que tambien resuelva en
    # un host Linux, donde ese nombre no existe por defecto.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-rednorte:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  db-rednorte:
    image: mysql:8.4
    container_name: cnt-db-rednorte
    environment:
      - MYSQL_ROOT_PASSWORD=11223344
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - vol_rednorte_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p11223344"]
      interval: 10s
      retries: 5
      timeout: 5s

volumes:
  vol_rednorte_data:
