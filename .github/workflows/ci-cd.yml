name: CI/CD — Backend RedNorte

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-ms-usuarios:
    name: Tests unitarios ms-usuarios
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar tests unitarios
        working-directory: Backend-usuarios
        run: mvn test --no-transfer-progress

      - name: Publicar reporte de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-tests-ms-usuarios
          path: Backend-usuarios/target/surefire-reports/
          retention-days: 7

  build-ms-usuarios:
    name: Build ms-usuarios
    runs-on: ubuntu-latest
    needs: test-ms-usuarios

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build del microservicio
        working-directory: Backend-usuarios
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Guardar artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: ms-usuarios-jar
          path: Backend-usuarios/target/*.jar
          retention-days: 7

  build-docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: build-ms-usuarios

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Build imagen Docker ms-usuarios
        run: |
          docker build -t ms-usuarios:${{ github.sha }} ./Backend-usuarios
          echo "Imagen construida exitosamente: ms-usuarios:${{ github.sha }}"
